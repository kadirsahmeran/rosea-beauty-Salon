<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Roséa Güzellik Merkezi; saç bakımı, cilt bakımı, makyaj ve spa hizmetlerinde uzman ellerin dokunuşunu sunar. Hemen online randevu alın."
    />
    <title>Roséa Güzellik Merkezi | Uzman Bakım ve Güzellik Hizmetleri</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #2c2320;
        color: #fffdfa;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.55s ease, visibility 0.55s ease;
      }
      #boot-splash.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #boot-splash::before {
        content: "";
        position: absolute;
        width: 28rem;
        height: 28rem;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(213, 84, 128, 0.28), transparent 68%);
        filter: blur(12px);
      }
      .boot-splash-inner {
        position: relative;
        text-align: center;
        padding: 1.5rem;
      }
      .boot-splash-mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 3.25rem;
        height: 3.25rem;
        margin-bottom: 1.35rem;
        border: 1px solid rgba(238, 171, 192, 0.35);
        border-radius: 999px;
        color: #eeabc0;
        font-size: 1.15rem;
        animation: boot-pulse 1.8s ease-in-out infinite;
      }
      .boot-splash-title {
        margin: 0;
        font-family: "Playfair Display", Georgia, serif;
        font-size: clamp(2.75rem, 8vw, 4.5rem);
        font-weight: 600;
        letter-spacing: 0.04em;
        animation: boot-rise 0.8s ease both;
      }
      .boot-splash-title em {
        font-style: italic;
        color: #eeabc0;
      }
      .boot-splash-line {
        width: 4.5rem;
        height: 1px;
        margin: 1.15rem auto 0;
        background: linear-gradient(90deg, transparent, #eeabc0, transparent);
        animation: boot-line 1s 0.25s ease both;
      }
      .boot-splash-sub {
        margin: 0.9rem 0 0;
        font-family: Poppins, system-ui, sans-serif;
        font-size: 0.68rem;
        font-weight: 500;
        letter-spacing: 0.38em;
        text-transform: uppercase;
        color: rgba(253, 248, 240, 0.62);
        animation: boot-rise 0.9s 0.15s ease both;
      }
      @keyframes boot-rise {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes boot-line {
        from { opacity: 0; transform: scaleX(0.3); }
        to { opacity: 1; transform: scaleX(1); }
      }
      @keyframes boot-pulse {
        0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(238, 171, 192, 0.28); }
        50% { transform: scale(1.04); box-shadow: 0 0 0 10px rgba(238, 171, 192, 0); }
      }
      html:has(#boot-splash:not(.is-hidden)) {
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash" role="status" aria-live="polite" aria-label="Roséa yükleniyor">
      <div class="boot-splash-inner">
        <div class="boot-splash-mark" aria-hidden="true">✦</div>
        <p class="boot-splash-title">Ros<em>éa</em></p>
        <div class="boot-splash-line" aria-hidden="true"></div>
        <p class="boot-splash-sub">Güzellik Merkezi</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
